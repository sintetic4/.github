# Testes do classificador da fila (lib.mjs). Roda nos PRs e pushes deste repo.
name: fila-test
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: node --test
        run: node --test .github/fila/lib.test.mjs
